version: '2.1'

networks:
  hajj-network:
    driver: bridge 

services:
  # ========================================================
  #                     (ZooKeeper)
  # ========================================================
  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888
    networks:
      - hajj-network

  # ========================================================
  #             Multi-Broker Kafka Cluster 
  # ========================================================
  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "29092:29092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://${EXTERNAL_IP:-192.168.2.12}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - hajj-network
    depends_on:
      - zoo1

  kafka2:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka2
    container_name: kafka2
    ports:
      - "29093:29093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://${EXTERNAL_IP:-192.168.2.12}:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 2
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - hajj-network
    depends_on:
      - zoo1

  kafka3:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka3
    container_name: kafka3
    ports:
      - "29094:29094"  
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://${EXTERNAL_IP:-192.168.2.12}:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 3
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - hajj-network
    depends_on:
      - zoo1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zoo1:2181
    networks:
      - hajj-network
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  # ========================================================
  #               (Hadoop + Spark + Hive)
  # ========================================================
  itvdelab:
    image: itversity/itvdelab
    hostname: itvdelab
    container_name: itvdelab
    ports:
      - "8888:8888"   # Jupyter Notebook
      - "9879:9870"   # Hadoop NameNode Web UI
      - "10000:10000" # Hive Server 2
      - "4040:4040"   # Spark Application UI
      - "8078:8088"   # YARN Resource Manager
      - "18180:18080" # Spark History Server
      - "18181:18081"
    volumes:
      - "./spark:/home/itversity/spark/"
      - "./drivers:/home/itversity/drivers"
      - ./hadoop-conf/core-site.xml:/configs/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-conf/hdfs-site.xml:/configs/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop-conf/mapred-site.xml:/configs/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./hadoop-conf/yarn-site.xml:/configs/opt/hadoop/etc/hadoop/yarn-site.xml:ro
    environment:
      SHELL: /bin/bash
    networks:
      - hajj-network
    depends_on:
      - cluster_util_db

  # ========================================================
  #             Metastore (PostgreSQL)
  # ========================================================
  cluster_util_db:
    image: postgres:13
    container_name: postgres_db
    ports:
      - "6432:5432"
    volumes:
      - ./cluster_util_db_scripts:/docker-entrypoint-initdb.d
    networks:
      - hajj-network
    environment:
      POSTGRES_PASSWORD: itversity